[project]
name = "sales-inbox-router"
version = "0.1.0"
description = "Sales inbox to task router backend and frontend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "google-generativeai>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
